<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przekąski - Projekt Party</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>PROJEKT PARTY</h1>
        <p>Katalog Atrakcji Eventowych</p>

    <main class="container">
        <a href="/" class="back-btn">← Powrót do katalogu</a>

        <div class="product-details">
            <div class="details-image">
                <img src="https://images.unsplash.com/photo-1572537165377-627a3a139fa4?w=600" alt="Zamek Smok">
            </div>
            <div class="details-info">
                <h2>Przekąski</h2>
                <div class="details-price">od 20 zł</div>
                
                <p class="details-text">
                    Opis wpisz tutaj
                </p>

                <h3>Rodzaje</h3>
                <table class="details-table">
                    <tr><th>Popcorn</th><td>ileśtam</td></tr>
                  <tr><th>Żelki Haribo</th><td>Misie</td></tr>
                </table>

                <h3>Cennik szczegółowy</h3>
                <table class="details-table">
                    <tr><td>Zakup</td><td><strong>10 zł</strong></td></tr>
                </table>

                <a href="mailto:ProjektPartyPL@gmail.com?subject=Tytuł maila" class="cta-btn">Zapytaj o wolny termin</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Projekt Party. Wszelkie prawa zastrzeżone.</p>
    </footer>

</html>
